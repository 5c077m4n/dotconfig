[startup]
tiled = true
daemon = true
start_in_terminal_mode = true

[daemon]
window_size = "smallest"
agent_autodetect = false
agent_detect_seconds = -1
agent_stall_seconds = -1
resume_agents = "off"
persist_scrollback = false

[appearance]
theme = "catppuccin_macchiato"
dockbar_position = "bottom"
border_style = "hidden"

nvim_navigation = true

dim_unfocused = 30
dim_foreground = true

hide_window_buttons = true

motion = "none"
zoom_animation = false

sidebar.enabled = false
calm = false

animations_enabled = false
alt_drag = false
paste_preview = false
whichkey_enabled = false
dock_workspace_tooltip = false
global_session = false

[agents]
enabled = false

[notifications]
agent.enabled = false
mail.enabled = false

[motion]
confetti = "off"

[shell]
integration = "off"

[tape]
autorun = "off"

[tasks]
auto_stage = false

[keybindings]
leader_key = "ctrl+a"

[keybindings.global]
