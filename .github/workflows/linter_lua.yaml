---
name: Lint neovim lua config

on:  # yamllint disable-line rule:truthy
  push:
    paths:
      - "**/*.lua"
  pull_request:
    paths:
      - "**/*.lua"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - name: Install stylua
        env:
          STYLUA_VERSION: "2.6.0"
          STYLUA_SHA256: "a485f72bbfa22e4642e77a84b5edc2611a5cab7477b34e2e709dd8f78e919895"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          echo "${STYLUA_SHA256}  $RUNNER_TEMP/stylua.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/stylua.zip" -d "$RUNNER_TEMP/stylua"
          echo "$RUNNER_TEMP/stylua" >> "$GITHUB_PATH"
      - name: Lint
        run: stylua --check .
