---
name: Neovim config sanity

on:  # yamllint disable-line rule:truthy
  push:
    paths:
      - "dotfiles/.config/nvim/**"
      - ".github/scripts/nvim_sanity.sh"
      - ".github/workflows/nvim_sanity.yaml"
  pull_request:
    paths:
      - "dotfiles/.config/nvim/**"
      - ".github/scripts/nvim_sanity.sh"
      - ".github/workflows/nvim_sanity.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Sanity (nvim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        nvim:
          - stable
          - nightly

    env:
      NVIM_TIMEOUT: "600"

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Install neovim
        uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ripgrep fd-find

      - name: Install tree-sitter CLI
        env:
          TREE_SITTER_VERSION: "0.27.2"
          TREE_SITTER_SHA256: "7ed56d152c52437397b9fcaa43cf341f49933cecc1ca291843f0d347c6e2cb3a"
        run: |
          mkdir -p "$RUNNER_TEMP/tree-sitter"
          curl -fsSL -o "$RUNNER_TEMP/tree-sitter.gz" \
            "https://github.com/tree-sitter/tree-sitter/releases/download/v${TREE_SITTER_VERSION}/tree-sitter-linux-x64.gz"
          echo "${TREE_SITTER_SHA256}  $RUNNER_TEMP/tree-sitter.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/tree-sitter.gz" > "$RUNNER_TEMP/tree-sitter/tree-sitter"
          chmod +x "$RUNNER_TEMP/tree-sitter/tree-sitter"
          echo "$RUNNER_TEMP/tree-sitter" >> "$GITHUB_PATH"

      - name: Startup on a clean machine (bootstraps lazy.nvim)
        run: .github/scripts/nvim_sanity.sh install

      - name: Startup with plugins installed
        run: .github/scripts/nvim_sanity.sh startup

      - name: Load all plugins
        run: .github/scripts/nvim_sanity.sh load-all

      - name: Health check
        run: .github/scripts/nvim_sanity.sh health
